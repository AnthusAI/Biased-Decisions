name: Replay and site audit

# Re-scores every committed answer record (no model inference) and checks that bd replay
# reproduces studies/ byte for byte before rebuilding and testing the generated site data.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python project and test dependencies
        run: python -m pip install --quiet -e '.[dev,build]'
      - name: Run Python and study runner tests
        run: python -m pytest -q biased_decisions scripts
      - name: Replay committed records
        run: python -m biased_decisions.cli replay
      - name: studies/ reproduces byte for byte
        run: git diff --exit-code -- studies/
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install site dependencies
        run: npm ci --prefix site --no-fund --no-audit
      - name: Regenerate leaderboard data
        run: python -m biased_decisions.cli report --json --date "$(git log -1 --format=%cs HEAD)"
      - name: Build site
        run: npm run build --prefix site
      - name: Test site
        run: npm test --prefix site
