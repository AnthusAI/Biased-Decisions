# Publish the leaderboard (site/) to GitHub Pages on each release, or by hand.
#
# The data file is rebuilt here from the record, never taken on trust from the commit: every
# scored cell is replayed from answers/ (`bd replay`), the replay must reproduce the committed
# studies/ byte for byte, and only then is site/data/leaderboard.json regenerated with
# `bd report --json`. The generated date is the release commit's own date, so the same commit
# always builds the same file, and the published site's version is the record commit it was
# built from. Nothing here calls an engine or needs a key.
name: pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # bd report --json reads the record commit from git history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the harness
        run: pip install -e .

      - name: Replay every cell from the committed record
        run: bd replay

      - name: The replay must reproduce the committed scored cells
        run: git diff --exit-code -- studies/

      - name: Regenerate the leaderboard data
        run: bd report --json --date "$(git log -1 --format=%cs HEAD)"

      - name: Show what changed in the data file (informational)
        run: git diff --stat -- site/data/leaderboard.json || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
