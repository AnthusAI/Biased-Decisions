ecision&#39;s own question</tspan><tspan x="168.5" dy="18.5">(&#34;paralegal or attorney?&#34;)</tspan></text></g><g class="ZGVjaXNpb24ubWVhc3VyZXM="><g class="shape" ><rect x="51" y="414" width="236" height="82" stroke="#c8102e" fill="#fdecef" style="stroke-width:2;" /></g><text x="169" y="452.5" fill="#b3122e" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="169" dy="0">How far the answer moves,</tspan><tspan x="169" dy="18.5">beyond a control edit</tspan></text></g><g class="c3RlcmVvdHlwZS52YXJpZXM="><g class="shape" ><rect x="423" y="50" width="200" height="82" stroke="#cfdfea" fill="#ffffff" style="stroke-width:2;" /></g><text x="523" y="88.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="523" dy="0">A phrase describing</tspan><tspan x="523" dy="18.5">a hypothetical person</tspan></text></g><g class="c3RlcmVvdHlwZS5hc2tz"><g class="shape" ><rect x="397" y="232" width="251" height="82" stroke="#cfdfea" fill="#ffffff" style="stroke-width:2;" /></g><text x="522.5" y="270.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="522.5" dy="0">A yes/no stereotype question</tspan><tspan x="522.5" dy="18.5">(&#34;is this person greedy?&#34;)</tspan></text></g><g class="c3RlcmVvdHlwZS5tZWFzdXJlcw=="><g class="shape" ><rect x="403" y="414" width="239" height="82" stroke="#c8102e" fill="#fdecef" style="stroke-width:2;" /></g><text x="522.5" y="452.5" fill="#b3122e" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="522.5" dy="0">How much more that group</tspan><tspan x="522.5" dy="18.5">is called the stereotype</tspan></text></g><g class="b3Bpbmlvbi52YXJpZXM="><g class="shape" ><rect x="771" y="50" width="185" height="82" stroke="#cfdfea" fill="#ffffff" style="stroke-width:2;" /></g><text x="863.5" y="88.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="863.5" dy="0">Nothing: no person,</tspan><tspan x="863.5" dy="18.5">no decision</tspan></text></g><g class="b3Bpbmlvbi5hc2tz"><g class="shape" ><rect x="748" y="232" width="230" height="82" stroke="#cfdfea" fill="#ffffff" style="stroke-width:2;" /></g><text x="863" y="270.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="863" dy="0">A claim, put to the model</tspan><tspan x="863" dy="18.5">directly (&#34;do you agree?&#34;)</tspan></text></g><g class="b3Bpbmlvbi5tZWFzdXJlcw=="><g class="shape" ><rect x="766" y="414" width="194" height="82" stroke="#c8102e" fill="#fdecef" style="stroke-width:2;" /></g><text x="863" y="452.5" fill="#b3122e" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="863" dy="0">How often the model</tspan><tspan x="863" dy="18.5">says it agrees</tspan></text></g><g class="ZGVjaXNpb24uKHZhcmllcyAtJmd0OyBhc2tzKVswXQ=="><marker id="mk-d2-3867452806-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 168.5 134 C 168.5 172 168.5 192 168.5 228" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3867452806-3488378134)" mask="url(#d2-3867452806)" /></g><g class="ZGVjaXNpb24uKGFza3MgLSZndDsgbWVhc3VyZXMpWzBd"><path d="M 168.5 316 C 168.5 354 168.5 374 168.5 410" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3867452806-3488378134)" mask="url(#d2-3867452806)" /></g><g class="c3RlcmVvdHlwZS4odmFyaWVzIC0mZ3Q7IGFza3MpWzBd"><path d="M 522.5 134 C 522.5 172 522.5 192 522.5 228" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3867452806-3488378134)" mask="url(#d2-3867452806)" /></g><g class="c3RlcmVvdHlwZS4oYXNrcyAtJmd0OyBtZWFzdXJlcylbMF0="><path d="M 522.5 316 C 522.5 354 522.5 374 522.5 410"