# AWS Amplify build spec (the app is connected to the GitHub repository; Amplify builds on push).
# Not a monorepo app: the app root is the repository root and the output is site/dist/.
#
# The build rebuilds the data from the record and fails, publishing nothing, if any spec fails
# or the replay does not reproduce studies/ (scripts/site-build.sh). Redirects live in the
# console (deploy/amplify-rules.json); response headers in customHttp.yml.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Tags date the release in the colophon; a shallow clone may not carry them.
        - git fetch --force --tags --unshallow origin || git fetch --force --tags origin || true
        # Python 3.10 or newer for the harness. The build image carries 3.11 under pyenv but does not
        # select it, so pick the newest installed 3.1x before creating the venv.
        - if command -v pyenv >/dev/null; then V=$(pyenv versions --bare | grep -E '^3\.1[0-9]+(\.[0-9]+)?$' | sort -V | tail -1); if [ -n "$V" ]; then pyenv global "$V"; fi; fi
        - PY=$(command -v python3.12 || command -v python3.11 || command -v python3); "$PY" -c 'import sys; assert sys.version_info >= (3, 10), sys.version' && "$PY" --version && "$PY" -m venv .venv
        - .venv/bin/pip install --quiet --upgrade pip
        - .venv/bin/pip install --quiet -e '.[dev,build]'
        # Node 22.12 or newer for Astro.
        - nvm install 22 && nvm use 22
        - npm ci --prefix site --no-fund --no-audit
    build:
      commands:
        - export SITE_URL="${SITE_URL:-https://biased-decisions.anth.us}"
        # The replay audit re-scores the committed answers (no model runs) and lives in
        # .github/workflows/replay.yml; the deploy only builds the site from studies/.
        - export SITE_SKIP_REPLAY=1
        - bash scripts/site-build.sh
  artifacts:
    baseDirectory: site/dist
    files:
      - "**/*"
  cache:
    paths:
      - site/node_modules/**/*
